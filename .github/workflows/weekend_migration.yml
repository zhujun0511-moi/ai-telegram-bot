name: Weekend Data Migration (TD backfill)

# 一次性數據來源遷移（§14.4）：TD 連續調整 backfill Bars_D/H + W resample。
# 只手動觸發（workflow_dispatch）。預設 dry-run；write=true 才真的覆蓋。
# ⚠️ 覆蓋前一定先跑 backup step（永遠執行，不受 write 影響）。
# ⚠️ 需在 BC GitHub Secrets 加：TWELVE_KEY（必要）、TWELVE_KEY_2（可選加速）。MONGO_URI 已有。
# 使用：市場關的週末觸發；write=true 前先 write=false 看 dry-run 摘要。

on:
  workflow_dispatch:
    inputs:
      write:
        description: "true=真的覆蓋 Mongo；false=dry-run 只算不寫"
        required: true
        default: "false"
      cutoff_date:
        description: "只保留 <= 此日期的 bar（排除 forming）。週末跑可留空；平日測試務必設 YYYY-MM-DD"
        required: false
        default: ""
      tickers:
        description: "逗號分隔指定票（測試用；留空=全部 342）"
        required: false
        default: ""

concurrency:
  group: weekend-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # 單 key 全量 D+H ~98-105 分鐘（BC 不加 TD2，見 handoff 2026-08-07）→ 放寬留重試餘裕
    env:
      MONGO_URI:      ${{ secrets.MONGO_URI }}
      TWELVE_KEY:     ${{ secrets.TWELVE_KEY }}
      TWELVE_KEY_2:   ${{ secrets.TWELVE_KEY_2 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install --quiet pymongo requests

      - name: Build common args
        id: args
        run: |
          WRITE_FLAG=""
          [ "${{ inputs.write }}" = "true" ] && WRITE_FLAG="--write"
          CUTOFF=""
          [ -n "${{ inputs.cutoff_date }}" ] && CUTOFF="--cutoff-date ${{ inputs.cutoff_date }}"
          TKS=""
          [ -n "${{ inputs.tickers }}" ] && TKS="--tickers ${{ inputs.tickers }}"
          echo "write_flag=$WRITE_FLAG"  >> "$GITHUB_OUTPUT"
          echo "cutoff=$CUTOFF"          >> "$GITHUB_OUTPUT"
          echo "tks=$TKS"                >> "$GITHUB_OUTPUT"
          echo "模式: write='${{ inputs.write }}' cutoff='${{ inputs.cutoff_date }}' tickers='${{ inputs.tickers }}'"

      # 0. 備份（永遠執行，覆蓋前的保險；上傳成 artifact）
      - name: Step 0 — Backup Bars_D/H
        working-directory: weekend_migration
        run: python -u backup_bars.py

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: bars-backup-${{ github.run_id }}
          path: weekend_migration/backup_*/
          retention-days: 30

      # 1. D backfill（TD 連續調整）
      - name: Step 1 — D backfill
        working-directory: weekend_migration
        run: python -u d_backfill.py ${{ steps.args.outputs.write_flag }} ${{ steps.args.outputs.cutoff }} ${{ steps.args.outputs.tks }}

      # 2. H backfill（TD 30m RTH）
      - name: Step 2 — H backfill
        working-directory: weekend_migration
        run: python -u h_backfill.py ${{ steps.args.outputs.write_flag }} ${{ steps.args.outputs.cutoff }} ${{ steps.args.outputs.tks }}

      # 5. W resample（從新 Bars_D）— 只有 write 時才有意義（dry-run 讀舊 D）
      - name: Step 5 — W resample
        working-directory: weekend_migration
        run: python -u w_resample.py ${{ steps.args.outputs.write_flag }} ${{ steps.args.outputs.tks }}

      # 4. 驗證（分割股連續 + D↔W + H RTH）——只在 write 模式跑
      #    （dry-run 讀的是未遷移的舊資料，本來就有斷層，不該讓 workflow 紅字）
      - name: Step 4 — Verify
        if: ${{ inputs.write == 'true' }}
        working-directory: weekend_migration
        run: python -u verify_migration.py ${{ steps.args.outputs.tks }}
